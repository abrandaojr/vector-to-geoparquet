[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "vector-to-geoparquet"
version = "1.4.0"
description = "Brazil-specific converter from any vector format to DuckDB-optimized GeoParquet using SIRGAS2000 (IBGE R.PR-1/2005)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Amintas Brandao Jr.", email = "abrandaojr@gmail.com" }
]
keywords = [
    "geoparquet", "geopandas", "duckdb", "sirgas2000", "brazil", "brasil",
    "geospatial", "hilbert", "spatial", "ibge", "sicar", "car", "prodes",
    "mapbiomas", "cerrado", "amazon", "deforestation", "forest-code"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "geopandas>=0.14",
    "pyogrio>=0.7",
    "pyarrow>=14",
    "shapely>=2.0",
    "numpy>=1.24",
]

[project.scripts]
vector-to-geoparquet = "vector_to_geoparquet:_cli"

[project.urls]
Repository = "https://github.com/abrandaojr/vector-to-geoparquet"

[tool.setuptools.packages.find]
where = ["."]
include = ["vector_to_geoparquet*"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
